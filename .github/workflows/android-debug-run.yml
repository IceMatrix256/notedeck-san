name: Android Debug APK Runner

on:
  push:
    branches:
      - feature/reactions

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y wget unzip

      - name: Install SDK cmdline tools
        run: |
          set -eux
          SDK_ROOT="${{ github.workspace }}/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd "$SDK_ROOT"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ || true
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

      - name: Create local.properties
        run: echo "sdk.dir=${{ github.workspace }}/android-sdk" > crates/notedeck_chrome/android/local.properties

      - name: Install Rust and cargo-ndk
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Add Rust Android targets
        run: |
          set -eux
          rustup target add aarch64-linux-android armv7-linux-androideabi || true

      - name: Build Rust native libs (arm64 + armeabi) (required)
        working-directory: ${{ github.workspace }}
        run: |
          set -eux
          mkdir -p crates/notedeck_chrome/android/app/src/main/jniLibs
          cargo ndk -t arm64-v8a -o ./crates/notedeck_chrome/android/app/src/main/jniLibs build --release
          cargo ndk -t armeabi-v7a -o ./crates/notedeck_chrome/android/app/src/main/jniLibs build --release
          ls -la ./crates/notedeck_chrome/android/app/src/main/jniLibs || true
          test -f ./crates/notedeck_chrome/android/app/src/main/jniLibs/arm64-v8a/libnotedeck_chrome.so
          test -f ./crates/notedeck_chrome/android/app/src/main/jniLibs/armeabi-v7a/libnotedeck_chrome.so

      - name: Build app
        working-directory: crates/notedeck_chrome/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Cleanup old debug releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          repo="${{ github.repository }}"
          token="${{ secrets.GITHUB_TOKEN }}"
          releases_json=$(curl -s -H "Authorization: token $token" "https://api.github.com/repos/$repo/releases")
          ids_to_delete=$(echo "$releases_json" | jq -r '[.[] | select(.tag_name | startswith("debug-apk-"))] | sort_by(.published_at) | reverse | .[3:] | .[].id' || true)
          if [ -z "$ids_to_delete" ]; then
            echo "No releases to delete"
          else
            for id in $ids_to_delete; do
              echo "Deleting release $id and its assets"
              assets=$(curl -s -H "Authorization: token $token" "https://api.github.com/repos/$repo/releases/$id/assets" | jq -r '.[].id' || true)
              for aid in $assets; do
                curl -s -X DELETE -H "Authorization: token $token" "https://api.github.com/repos/$repo/releases/assets/$aid" || true
              done
              curl -s -X DELETE -H "Authorization: token $token" "https://api.github.com/repos/$repo/releases/$id" || true
            done
          fi

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: debug-apk-${{ github.run_number }}-${{ github.sha }}
          release_name: debug-apk-${{ github.run_number }}-${{ github.sha }}
          draft: false
          prerelease: false

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: crates/notedeck_chrome/android/app/build/outputs/apk/debug/app-debug.apk
          asset_name: app-debug-${{ github.run_number }}.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: crates/notedeck_chrome/android/app/build/outputs/apk/debug/app-debug.apk
