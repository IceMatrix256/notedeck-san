name: Android Debug APK Runner

on:
  push:
    branches:
      - feature/reactions

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y wget unzip

      - name: Install SDK cmdline tools
        run: |
          set -eux
          SDK_ROOT="${{ github.workspace }}/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd "$SDK_ROOT"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ || true
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

      - name: Create local.properties
        run: echo "sdk.dir=${{ github.workspace }}/android-sdk" > crates/notedeck_chrome/android/local.properties

      - name: Build app
        working-directory: crates/notedeck_chrome/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Create GitHub release and upload APK
        if: ${{ success() }}
        run: |
          set -eux
          APK=crates/notedeck_chrome/android/app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then echo "APK not found"; exit 1; fi
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          TAG="debug-apk-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          DATA=$(printf '{"tag_name":"%s","name":"%s","draft":false,"prerelease":false}' "$TAG" "$TAG")
          RESP=$(curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -d "$DATA" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases")
          UPLOAD_URL=$(echo "$RESP" | python3 -c "import sys, json; obj=json.load(sys.stdin); print(obj.get('upload_url','').split('{')[0])")
          if [ -z "$UPLOAD_URL" ]; then echo "Failed to create release: $RESP"; exit 1; fi
          curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/vnd.android.package-archive" --data-binary @"$APK" "$UPLOAD_URL?name=app-debug-${GITHUB_RUN_NUMBER}.apk" -o /tmp/upload_resp || true
          echo "Release upload response:" && cat /tmp/upload_resp || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: crates/notedeck_chrome/android/app/build/outputs/apk/debug/app-debug.apk
