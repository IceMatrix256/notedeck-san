name: Android Debug APK (feature/reactions)

on:
  push:
    branches:
      - feature/reactions

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required packages
        run: sudo apt-get update && sudo apt-get install -y unzip libncurses5

      - name: Install Android SDK cmdline-tools
        uses: r0adkll/setup-android@v2
        with:
          api-level: 33
          build-tools: 33.0.2
          ndk: 25.2.9519653

      - name: Install Rust and cargo-ndk
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust native libs (arm64) (optional)
        working-directory: ${{ github.workspace }}
        run: |
          cargo ndk --target arm64-v8a -o ./crates/notedeck_chrome/android/app/src/main/jniLibs/ build --profile release || echo 'cargo ndk failed; continuing without native libs'

      - name: Build Android app (assembleDebug)
        working-directory: crates/notedeck_chrome/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: crates/notedeck_chrome/android/app/build/outputs/apk/debug/app-debug.apk
