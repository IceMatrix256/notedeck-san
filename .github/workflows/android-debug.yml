name: Android Debug APK (feature/reactions)

on:
  push:
    branches:
      - feature/reactions
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required packages
        run: sudo apt-get update && sudo apt-get install -y unzip libncurses6 jq

      - name: Install Android SDK cmdline-tools and packages
        run: |
          SDK_ROOT="${{ github.workspace }}/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd "$SDK_ROOT"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ || true
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

      - name: Set ANDROID_NDK_HOME and create local.properties
        run: |
          SDK_ROOT="${{ github.workspace }}/android-sdk"
          NDK_DIR=$(ls -d "$SDK_ROOT/ndk"/* | sort -V | tail -n 1)
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "sdk.dir=$SDK_ROOT" > crates/notedeck_chrome/android/local.properties

      - name: "Debug: list installed SDK components"
        run: |
          echo "SDK root: ${{ github.workspace }}/android-sdk"
          ${{ github.workspace }}/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=${{ github.workspace }}/android-sdk --list || true

      - name: Install Rust and cargo-ndk
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Add Rust Android targets
        run: |
          set -eux
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android || true

      - name: Build Rust native libs (arm64 + armeabi + x86 + x86_64) (required)
        working-directory: ${{ github.workspace }}
        run: |
          set -eux
          mkdir -p crates/notedeck_chrome/android/app/src/main/jniLibs
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 -o ./crates/notedeck_chrome/android/app/src/main/jniLibs build --release
          ls -la ./crates/notedeck_chrome/android/app/src/main/jniLibs || true
          test -f ./crates/notedeck_chrome/android/app/src/main/jniLibs/arm64-v8a/libnotedeck_chrome.so
          test -f ./crates/notedeck_chrome/android/app/src/main/jniLibs/armeabi-v7a/libnotedeck_chrome.so
          test -f ./crates/notedeck_chrome/android/app/src/main/jniLibs/x86/libnotedeck_chrome.so
          test -f ./crates/notedeck_chrome/android/app/src/main/jniLibs/x86_64/libnotedeck_chrome.so

      - name: Build Android app (assembleDebug)
        working-directory: crates/notedeck_chrome/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Cleanup old debug artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          repo="${{ github.repository }}"
          token="${{ secrets.GITHUB_TOKEN }}"
          artifacts_json=$(curl -s -H "Authorization: token $token" "https://api.github.com/repos/$repo/actions/artifacts")
          ids_to_delete=$(echo "$artifacts_json" | jq -r '[.artifacts[] | select(.name=="debug-apk")] | sort_by(.created_at) | reverse | .[3:] | .[].id' || true)
          if [ -z "$ids_to_delete" ]; then
            echo "No artifacts to delete"
          else
            for id in $ids_to_delete; do
              echo "Deleting artifact $id"
              curl -s -X DELETE -H "Authorization: token $token" "https://api.github.com/repos/$repo/actions/artifacts/$id" || true
            done
          fi

      - name: Save native lib strings for inspection
        run: |
          set -eux
          mkdir -p artifacts/native-strings
          for so in ./crates/notedeck_chrome/android/app/src/main/jniLibs/*/*.so; do
            arch=$(basename $(dirname "$so"))
            strings "$so" | sed -n '1,200p' > "artifacts/native-strings/${arch}.txt" || true
          done
        continue-on-error: true

      - name: Upload native-strings
        uses: actions/upload-artifact@v4
        with:
          name: native-strings
          path: artifacts/native-strings

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: crates/notedeck_chrome/android/app/build/outputs/apk/debug/app-debug.apk

  run-emulator:
    needs: build-apk
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - name: Download debug APK artifact
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: artifact
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK cmdline-tools and packages
        run: |
          SDK_ROOT="${{ github.workspace }}/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd "$SDK_ROOT"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ || true
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          # Persist tool locations for subsequent steps and actions
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
      - name: "Debug: show PATH and adb"
        run: |
          echo "PATH=$PATH"
          which adb || true
          ls -la $ANDROID_SDK_ROOT/platform-tools || true
          adb --version || true

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim
          # provide a minimal required script so the action doesn't fail; further steps will perform installs and checks
          script: |
            echo "Emulator started; continuing with downstream steps"
      - name: Find APK
        run: |
          set -eux
          apk=$(find . -type f -name "app-debug.apk" | head -n 1)
          echo "APK => $apk"
          ls -la "$apk"
          echo "APK_PATH=$apk" >> $GITHUB_ENV
      - name: Install APK on emulator
        run: |
          set -eux
          adb wait-for-device
          adb install -r "$APK_PATH"
      - name: Start app
        run: |
          set -eux
          adb shell am start -n com.damus.notedeck/.MainActivity || true
      - name: Clear logcat
        run: adb logcat -c
      - name: Capture logcat and exercise UI
        run: |
          set -eux
          adb logcat -v time | grep --line-buffered -E "native-echo|notedeck_java|notedeck_native|MainActivity" > native_logcat.txt &
          pid=$!
          sleep 2
          adb shell input tap 200 400 || true
          adb shell input swipe 200 400 200 400 1500 || true
          sleep 10
          kill $pid || true
      - name: Pull external native log files
        run: |
          set -eux
          mkdir -p pulled
          adb pull /sdcard/Android/data/com.damus.notedeck/files/notedeck_native.log pulled/ || true
          adb pull /sdcard/Android/data/com.damus.notedeck/files/notedeck_java.log pulled/ || true
      - name: Upload emulator logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logs
          path: |
            native_logcat.txt
            pulled

